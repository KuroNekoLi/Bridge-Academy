name: B4 Academy branch validation
on:
  push:
    branches: ["feature/b4-bridge-academy"]
    paths:
      - "apps/bridge_academy_flutter/**"
      - "docs/product/B4_GUIDED_TRAINING_ACCEPTANCE.md"
      - ".github/workflows/b4-academy-branch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/bridge_academy_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter web project
        run: |
          flutter create --platforms=web --project-name=bridge_academy_flutter .
          flutter pub get
      - name: Analyze all Flutter code
        run: flutter analyze --no-pub
      - name: All unit and Widget tests
        run: flutter test --no-pub --reporter expanded
      - name: Build Flutter Web release
        run: flutter build web --no-pub --release
