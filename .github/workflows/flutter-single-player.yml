name: Flutter M2 Single Player
on:
  push:
    branches: [master, 'feature/c3-2-personalized-recommendations']
    paths:
      - "apps/bridge_academy_flutter/**"
      - "packages/bridge_core/**"
      - "packages/bridge_ben_adapter/**"
      - ".github/workflows/flutter-single-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/bridge_academy_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web platform boilerplate
        run: flutter create --platforms=web --project-name=bridge_academy_flutter .
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze UI and tests
        run: flutter analyze --no-pub
      - name: Run Widget and session tests
        run: flutter test --no-pub --reporter expanded
      - name: Compile web release
        run: flutter build web --no-pub --release



  browser-chrome:
    name: Real ChromeDriver end-to-end (demo, not BEN)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/bridge_academy_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web project and install dependencies
        run: |
          flutter create --platforms=web --project-name=bridge_academy_flutter .
          flutter pub get
      - name: Install official ChromeDriver with Puppeteer browser manager
        run: |
          CHROME_VERSION="$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$CHROME_VERSION" ]; then
            echo "Could not determine installed Chrome version" >&2
            exit 1
          fi
          echo "Matching ChromeDriver to Google Chrome $CHROME_VERSION"
          npx --yes @puppeteer/browsers install "chromedriver@$CHROME_VERSION"
          DRIVER="$(find "$PWD/chromedriver" -type f -name chromedriver -perm -u+x | head -n 1)"
          if [ -z "$DRIVER" ]; then
            echo "ChromeDriver executable missing" >&2
            exit 1
          fi
          "$DRIVER" --version
          echo "CHROMEDRIVER=$DRIVER" >> "$GITHUB_ENV"
      - name: Run headless Chrome browser integration test
        run: |
          "$CHROMEDRIVER" --port=4444 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          sleep 3
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/browser_table_test.dart \
            -d web-server --browser-name=chrome
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/browser_secure_checkpoint_test.dart \
            -d web-server --browser-name=chrome
