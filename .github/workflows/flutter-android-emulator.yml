name: Flutter Android Emulator QA (M2-F08)
# Device/emulator UI QA is paused by owner request (2026-10-15).
# Explicit owner approval and a new change to this workflow are required to restore it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui:
    # Guard against manual dispatch too: never allocate an AVD runner before approval.
    if: ${{ false }}
    name: Android API 35 x86_64 device UI
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Reclaim unused runner toolchains for Android AVD
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before reclaiming unrelated SDKs:"
          df -h /
          # Keep Android SDK, Java runtime and the Flutter SDK intact.
          # These preinstalled CI image toolchains are not used by this job.
          for directory in /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -d "$directory" ]; then
              echo "Removing unused CI toolchain: $directory"
              sudo rm -rf -- "$directory"
            fi
          done
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /
          available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          if [ "$available_kb" -lt 12582912 ]; then
            echo "Insufficient free disk for Android Emulator: require >= 12 GiB" >&2
            exit 1
          fi
      - name: Generate native Android host and resolve packages
        working-directory: apps/bridge_academy_flutter
        run: |
          flutter create --platforms=android --project-name=bridge_academy_flutter .
          flutter pub get
          flutter doctor -v
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runner disk diagnostics (no private contents)
        run: df -h "$HOME" /usr/local/lib/android/sdk
      - name: Execute genuine Android emulator UI interaction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          sdcard-path-or-size: 128M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2048
          script: |
            cd apps/bridge_academy_flutter && flutter devices && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/android_table_test.dart -d emulator-5554 && bash scripts/android_process_restart_e2e.sh

