name: M5 Public Auction Coach — Domain and Flutter
on:
  push:
    branches: [master]
    paths:
      - 'packages/bridge_conventions/**'
      - 'apps/bridge_academy_flutter/lib/src/conventions/auction_coach_page.dart'
      - 'apps/bridge_academy_flutter/lib/src/bridge_app.dart'
      - 'apps/bridge_academy_flutter/lib/src/gateway_table.dart'
      - 'apps/bridge_academy_flutter/lib/src/app_copy.dart'
      - 'apps/bridge_academy_flutter/test/m5_auction_coach_test.dart'
      - '.github/workflows/m5-coach.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coach:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: M5.1 public transcript, provenance and privacy domain regression
        working-directory: packages/bridge_conventions
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded
      - name: M5.2 coach UI + local convention comparison widgets
        working-directory: apps/bridge_academy_flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test test/m5_auction_coach_test.dart --reporter expanded
      - name: Explicit capability boundary
        run: |
          echo "M5: public-only coach; no BEN private reasoning, actual alternate proposals or expert-golden evidence inferred."
          echo "No hidden Deal, production capability grant, mobile emulator, device QA, or ranked scoring."
