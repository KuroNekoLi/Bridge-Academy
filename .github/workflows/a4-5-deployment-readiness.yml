name: A4.5 Deployment Readiness (static)
on:
  workflow_dispatch:
  push:
    branches: [master, feature/a4-5-deployment-readiness]
    paths:
      - 'scripts/a4_5_preflight.py'
      - 'scripts/test_a4_5_preflight.py'
      - 'deploy/a4_5/**'
      - '.github/workflows/a4-5-deployment-readiness.yml'
  pull_request:
    paths:
      - 'scripts/a4_5_preflight.py'
      - 'scripts/test_a4_5_preflight.py'
      - 'deploy/a4_5/**'
permissions:
  contents: read
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static safety unit tests
        run: python3 -m unittest discover -s scripts -p 'test_a4_5_preflight.py' -v
      - name: Staging example configuration check
        run: python3 scripts/a4_5_preflight.py --profile staging --config deploy/a4_5/staging.metadata.example.json
      - name: Production example MUST be blocked
        shell: bash
        run: |
          if python3 scripts/a4_5_preflight.py --profile production --config deploy/a4_5/staging.metadata.example.json; then
            echo 'Unsafe: unapproved production configuration passed'
            exit 1
          fi
          echo 'Production has not been approved'

      - name: Check Zeabur staging structure without deploying
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('deploy/a4_5/zeabur')
          for p in ('Dockerfile','entrypoint.sh','healthcheck.sh','nginx.conf','README.md'):
              assert (d/p).is_file(), p
          docker=(d/'Dockerfile').read_text()
          entry=(d/'entrypoint.sh').read_text()
          proxy=(d/'nginx.conf').read_text()
          assert 'EXPOSE 8080' in docker
          assert '72653ec1b5c17116faea229e9b975ea5622aa1f7' in docker
          assert '127.0.0.1:8085' in entry and '127.0.0.1:8086' in entry
          assert 'auth_basic_user_file' in proxy
          assert '127.0.0.1:8086' in proxy
          print('STAGING_STRUCTURE_STATIC_OK - Docker not built')
          PY
          bash -n deploy/a4_5/zeabur/entrypoint.sh
          sh -n deploy/a4_5/zeabur/healthcheck.sh
