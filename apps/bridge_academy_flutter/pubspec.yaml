name: bridge_academy_flutter
description: Flutter single-player bridge table for Bridge Academy
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bridge_core:
    path: ../../packages/bridge_core
  bridge_dds_adapter:
    path: ../../packages/bridge_dds_adapter
  bridge_ben_adapter:
    path: ../../packages/bridge_ben_adapter
  shared_preferences: ^2.5.4
  crypto: ^3.0.6
  http: ^1.5.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true


